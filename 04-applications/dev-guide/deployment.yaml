apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-guide
  namespace: dev-guide
  labels:
    app: dev-guide
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-guide
  template:
    metadata:
      labels:
        app: dev-guide
    spec:
      containers:
      - name: dev-guide
        # VitePressの公式サンプルイメージ（軽量で高速）
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: content
        configMap:
          name: dev-guide-content

