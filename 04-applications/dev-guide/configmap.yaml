apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-guide-content
  namespace: dev-guide
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>開発ガイド | Home Kubernetes</title>
      <style>
        :root {
          --bg-primary: #0f172a;
          --bg-secondary: #1e293b;
          --bg-card: #334155;
          --text-primary: #f1f5f9;
          --text-secondary: #94a3b8;
          --accent: #38bdf8;
          --accent-hover: #0ea5e9;
          --success: #22c55e;
          --warning: #f59e0b;
        }
        
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          line-height: 1.6;
          min-height: 100vh;
        }
        
        .header {
          background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
          border-bottom: 1px solid var(--bg-card);
          padding: 1rem 2rem;
          position: sticky;
          top: 0;
          z-index: 100;
        }
        
        .header-content {
          max-width: 1200px;
          margin: 0 auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        
        .logo {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          font-size: 1.25rem;
          font-weight: 700;
          color: var(--accent);
        }
        
        .logo-icon {
          width: 32px;
          height: 32px;
          background: var(--accent);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1rem;
        }
        
        .nav {
          display: flex;
          gap: 2rem;
        }
        
        .nav a {
          color: var(--text-secondary);
          text-decoration: none;
          font-weight: 500;
          transition: color 0.2s;
        }
        
        .nav a:hover {
          color: var(--accent);
        }
        
        .hero {
          text-align: center;
          padding: 6rem 2rem;
          background: radial-gradient(ellipse at top, var(--bg-secondary) 0%, var(--bg-primary) 70%);
        }
        
        .hero h1 {
          font-size: 3.5rem;
          font-weight: 800;
          margin-bottom: 1.5rem;
          background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        
        .hero p {
          font-size: 1.25rem;
          color: var(--text-secondary);
          max-width: 600px;
          margin: 0 auto 2rem;
        }
        
        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          background: var(--bg-card);
          padding: 0.5rem 1rem;
          border-radius: 9999px;
          font-size: 0.875rem;
        }
        
        .status-dot {
          width: 8px;
          height: 8px;
          background: var(--success);
          border-radius: 50%;
          animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        
        .main {
          max-width: 1200px;
          margin: 0 auto;
          padding: 4rem 2rem;
        }
        
        .section-title {
          font-size: 1.5rem;
          font-weight: 700;
          margin-bottom: 2rem;
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        
        .cards {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 1.5rem;
          margin-bottom: 4rem;
        }
        
        .card {
          background: var(--bg-secondary);
          border: 1px solid var(--bg-card);
          border-radius: 12px;
          padding: 1.5rem;
          transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .card:hover {
          transform: translateY(-4px);
          box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        
        .card-icon {
          width: 48px;
          height: 48px;
          background: var(--bg-card);
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.5rem;
          margin-bottom: 1rem;
        }
        
        .card h3 {
          font-size: 1.125rem;
          margin-bottom: 0.5rem;
        }
        
        .card p {
          color: var(--text-secondary);
          font-size: 0.875rem;
        }
        
        .cluster-info {
          background: var(--bg-secondary);
          border: 1px solid var(--bg-card);
          border-radius: 12px;
          padding: 2rem;
          margin-bottom: 4rem;
        }
        
        .cluster-info h2 {
          font-size: 1.25rem;
          margin-bottom: 1.5rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        
        .nodes {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 1rem;
        }
        
        .node {
          background: var(--bg-card);
          border-radius: 8px;
          padding: 1rem;
        }
        
        .node-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0.5rem;
        }
        
        .node-name {
          font-weight: 600;
        }
        
        .node-status {
          font-size: 0.75rem;
          padding: 0.25rem 0.5rem;
          background: rgba(34, 197, 94, 0.2);
          color: var(--success);
          border-radius: 4px;
        }
        
        .node-ip {
          font-size: 0.875rem;
          color: var(--text-secondary);
          font-family: 'JetBrains Mono', monospace;
        }
        
        .code-block {
          background: var(--bg-card);
          border-radius: 8px;
          padding: 1rem;
          overflow-x: auto;
          font-family: 'JetBrains Mono', 'Fira Code', monospace;
          font-size: 0.875rem;
          margin: 1rem 0;
        }
        
        .footer {
          text-align: center;
          padding: 2rem;
          color: var(--text-secondary);
          font-size: 0.875rem;
          border-top: 1px solid var(--bg-card);
        }
      </style>
    </head>
    <body>
      <header class="header">
        <div class="header-content">
          <div class="logo">
            <div class="logo-icon">☸️</div>
            <span>Home K8s Guide</span>
          </div>
          <nav class="nav">
            <a href="#getting-started">はじめに</a>
            <a href="#architecture">構成</a>
            <a href="#operations">運用</a>
            <a href="#troubleshooting">トラブルシューティング</a>
          </nav>
        </div>
      </header>
      
      <section class="hero">
        <h1>自宅 Kubernetes 開発ガイド</h1>
        <p>Proxmox + k3s で構築した自宅 Kubernetes 環境の統合ドキュメントです。</p>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>クラスター稼働中</span>
        </div>
      </section>
      
      <main class="main">
        <div class="cluster-info">
          <h2>🖥️ クラスター情報</h2>
          <div class="nodes">
            <div class="node">
              <div class="node-header">
                <span class="node-name">k8s-master</span>
                <span class="node-status">Ready</span>
              </div>
              <div class="node-ip">192.168.10.111</div>
            </div>
            <div class="node">
              <div class="node-header">
                <span class="node-name">k8s-worker1</span>
                <span class="node-status">Ready</span>
              </div>
              <div class="node-ip">192.168.10.112</div>
            </div>
            <div class="node">
              <div class="node-header">
                <span class="node-name">k8s-worker2</span>
                <span class="node-status">Ready</span>
              </div>
              <div class="node-ip">192.168.10.113</div>
            </div>
          </div>
        </div>
        
        <h2 class="section-title" id="getting-started">📚 ドキュメント</h2>
        <div class="cards">
          <div class="card">
            <div class="card-icon">🚀</div>
            <h3>クイックスタート</h3>
            <p>k3sクラスターの構築から最初のアプリケーションデプロイまで。</p>
          </div>
          <div class="card">
            <div class="card-icon">🏗️</div>
            <h3>アーキテクチャ</h3>
            <p>Proxmox + k3s の構成と設計思想について。</p>
          </div>
          <div class="card">
            <div class="card-icon">🔧</div>
            <h3>運用ガイド</h3>
            <p>日常的なクラスター運用とメンテナンス手順。</p>
          </div>
          <div class="card">
            <div class="card-icon">🐛</div>
            <h3>トラブルシューティング</h3>
            <p>よくある問題と解決方法（IP競合、SSH接続など）。</p>
          </div>
        </div>
        
        <h2 class="section-title" id="quick-commands">⌨️ よく使うコマンド</h2>
        <div class="code-block">
<pre># クラスター状態確認
kubectl get nodes -o wide

# Pod一覧
kubectl get pods -A

# サービス一覧
kubectl get svc -A

# ログ確認
kubectl logs -f [pod-name]</pre>
        </div>
      </main>
      
      <footer class="footer">
        <p>Home Kubernetes Environment | Powered by k3s on Proxmox VE</p>
      </footer>
    </body>
    </html>

