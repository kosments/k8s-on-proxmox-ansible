---
# Ollama用永続ボリューム（モデル保存用）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: local-llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
# Ollama Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: local-llm
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "4"
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models
---
# Ollama Service
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: local-llm
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP

